# Weekly dependency and Actions updates. Security advisories raise their own
# PRs as soon as they publish, independent of this schedule.
#
# Actions are pinned to commit SHAs in the workflows (a tag can be moved to
# point at different code; a SHA cannot). Dependabot keeps those SHAs current
# and rewrites the trailing "# vX.Y.Z" comment with them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A release published in the last few days is the window in which a
    # hijacked package does its damage before it is pulled. Wait it out.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # 6.8.11 fails the desktop smoke harness: the clean retrieve's report goes
    # missing from the Output pane. CI does not run that harness, so a
    # Dependabot PR would pass CI anyway. Held back until someone works out why.
    ignore:
      - dependency-name: electron-updater
        versions: [">=6.8.10"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
