name: Desktop app

on:
  push:
    tags: ['desktop-v*', 'v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach installers to a GitHub release for this tag'
        type: boolean
        default: false

# The engine is reused verbatim by the desktop app (file:.. dependency), so the
# app is built straight from this repo. Installers are per-OS.
#
# Signing status, precisely — the Windows installers are unsigned, and the macOS
# .app is AD-HOC signed (see desktop/ad-hoc-sign-mac.js) but not notarized:
#
#   * Ad-hoc is not real signing. There is no certificate, no Developer ID and
#     no notarization ticket, so it buys exactly one thing — an arm64 binary
#     that macOS is willing to execute at all. Apple Silicon refuses to load an
#     arm64 Mach-O with no signature whatsoever and reports it to the user as
#     "damaged and can't be opened", which is what v0.14.1 shipped.
#   * It does NOT clear Gatekeeper. First launch on any Mac still shows the
#     "unidentified developer" prompt and still needs right-click -> Open.
#     Removing that needs a paid Apple Developer ID plus notarization secrets
#     this repo does not have; that is an owner decision, not a build fix.
#   * Windows is unchanged: SmartScreen still warns (More info -> Run anyway).
#
# desktop/README.md carries the user-facing version of all of this, including
# the recovery steps for anyone who already downloaded v0.14.1 or earlier.
jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # A full build takes ~10 minutes; a v0.6.0 release run sat for 45+ on a
    # hung apt mirror. Fail fast instead — a re-run costs minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The desktop version is load-bearing: it becomes the version in
      # latest.yml, which is the sole input to the installed app's update decision. A tag on
      # a commit where desktop/package.json was forgotten at the old number
      # would publish a feed that says "no update" forever — with a green
      # pipeline. The CLI release has this exact guard because it fired once.
      - name: The app's version must match the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          EXPECTED="${TAG#desktop-}"
          EXPECTED="${EXPECTED#v}"
          ACTUAL="$(node -p "require('./desktop/package.json').version")"
          echo "tag=$TAG expected=$EXPECTED actual=$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tag $TAG expects version $EXPECTED but desktop/package.json says $ACTUAL. The tag is probably on a commit older than the version bump. Shipping this would attach a latest.yml that tells every installed app there is no update."
            exit 1
          fi

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build installers
        working-directory: desktop
        # --publish never: with a publish block in package.json, electron-builder
        # would otherwise try to upload to GitHub itself on a tag build and fail
        # on the missing token. The update metadata (latest*.yml, blockmaps) is
        # still written to release/ and attached by the release job below —
        # that's the feed the in-app updater reads.
        run: npm run dist -- --publish never
        env:
          # Don't go hunting the runner's keychain for a certificate. This is a
          # "stop searching" flag, not a "never sign" flag — with CSC_NAME or
          # mac.identity set, electron-builder 25 still signs for real, so this
          # does not block a future Developer ID setup.
          #
          # It also does not mean the app ships unsigned any more: the afterPack
          # hook (desktop/ad-hoc-sign-mac.js) ad-hoc signs the .app before the
          # .dmg is built around it, because Apple Silicon will not run an arm64
          # binary carrying no signature at all. If that hook fails, it throws
          # and this step fails — an arm64 .dmg that cannot open must never
          # reach a release page again.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # The hook above verifies its own work, so this is here to catch the one
      # thing it cannot: the hook not running at all. A renamed file, a typo in
      # the `afterPack` key, or an electron-builder major that moves the hook
      # would all leave a perfectly green build producing an unsigned .app —
      # which is precisely how this bug shipped. Check the artifact itself.
      - name: The macOS app must be signed
        if: matrix.os == 'macos-latest'
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r app; do
            found=$((found + 1))
            echo "== $app"
            # --deep --strict applies the same checks the loader will.
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=2 "$app" 2>&1 | grep -E 'Signature|Identifier' || true
          done < <(find release -maxdepth 2 -name '*.app' -type d)
          if [ "$found" -eq 0 ]; then
            echo "::error::No .app found under desktop/release to verify. The macOS build produced nothing signable, or the layout changed."
            exit 1
          fi
          echo "verified $found .app bundle(s)"

      - name: Collect artifacts
        shell: bash
        working-directory: desktop
        run: |
          mkdir -p out
          # Copy the distributable installers, not the unpacked tree. The *.yml
          # glob is for the updater feed (latest*.yml); builder-debug.yml is an
          # electron-builder internal dump that must not reach the release page.
          find release -maxdepth 1 -type f ! -name 'builder-debug.yml' \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.blockmap' -o -name '*.yml' \) \
            -exec cp {} out/ \; || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: asteris-dicom-${{ matrix.label }}
          path: desktop/out/*
          if-no-files-found: warn

  release:
    name: attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The release body comes from a file in the repo, so the repo has to be
      # checked out here. Checkout goes first: it cleans the workspace, which
      # would wipe the downloaded artifacts if it ran after them.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          ls -la
          # The release page shows an asset's label INSTEAD of its filename,
          # so every label repeats the real filename in parentheses. gh takes
          # 'path#label' on both create and upload. The mapping covers the
          # CLI binaries too, so both workflows label identically no matter
          # which one wins the race to create the release.
          label_for() {
            case "$1" in
              dcm-windows-x64.exe)    echo "CLI — Windows x64 ($1)" ;;
              dcm-macos-arm64)        echo "CLI — macOS Apple Silicon ($1)" ;;
              dcm-macos-x64)          echo "CLI — macOS Intel ($1)" ;;
              dcm-linux-x64)          echo "CLI — Linux x64 ($1)" ;;
              SHA256SUMS.txt)         echo "Checksums for the CLI binaries ($1)" ;;
              *-setup.exe)            echo "App — Windows installer, auto-updates ($1)" ;;
              *-portable.exe)         echo "App — Windows portable, no install ($1)" ;;
              *arm64*.dmg)            echo "App — macOS Apple Silicon ($1)" ;;
              *x64*.dmg)              echo "App — macOS Intel ($1)" ;;
              latest*.yml|*.blockmap) echo "App auto-update metadata — leave attached ($1)" ;;
              *)                      echo "" ;;
            esac
          }

          assets=()
          for f in *; do
            label="$(label_for "$f")"
            if [ -n "$label" ]; then
              assets+=("$f#$label")
            else
              assets+=("$f")
            fi
          done

          # --notes-file supplies the "which file do I want" guide as the
          # body; --generate-notes then appends the generated changelog after
          # it (the API prepends a supplied body to generated notes).
          gh release create "$TAG" "${assets[@]}" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            --notes-file "$GITHUB_WORKSPACE/.github/RELEASE_NOTES_HEADER.md" \
            || gh release upload "$TAG" "${assets[@]}" --repo "${{ github.repository }}" --clobber
