name: Desktop app

on:
  push:
    tags: ['desktop-v*', 'v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach installers to a GitHub release for this tag'
        type: boolean
        default: false

# The engine is reused verbatim by the desktop app (file:.. dependency), so the
# app is built straight from this repo. Installers are per-OS and unsigned, same
# policy as the CLI binaries.
jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
          - os: ubuntu-latest
            label: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Linux needs a couple of libraries for electron-builder's AppImage step.
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build installers
        working-directory: desktop
        run: npm run dist
        env:
          # Never try to sign; there is no certificate and CSC_* being unset is
          # enough on macOS, but make the intent explicit.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Collect artifacts
        shell: bash
        working-directory: desktop
        run: |
          mkdir -p out
          # Copy the distributable installers, not the unpacked tree.
          find release -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.blockmap' -o -name '*.yml' \) \
            -exec cp {} out/ \; || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: newlumen-dicom-${{ matrix.label }}
          path: desktop/out/*
          if-no-files-found: warn

  release:
    name: attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          ls -la
          gh release create "$TAG" * \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            || gh release upload "$TAG" * --repo "${{ github.repository }}" --clobber
