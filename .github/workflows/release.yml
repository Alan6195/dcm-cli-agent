name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            asset: dcm-windows-x64.exe
            built: dist/dcm.exe
            arch: x64
          - os: macos-latest
            label: macos-arm64
            asset: dcm-macos-arm64
            built: dist/dcm
            arch: arm64
          # Intel Macs are built on the Apple Silicon runner using an x64
          # Node under Rosetta 2. A SEA is a copy of the running Node binary,
          # so an x64 Node produces an x64 executable. The dedicated macos-13
          # runner label is being retired and can queue indefinitely, which
          # would block every release behind a runner that never arrives.
          - os: macos-latest
            label: macos-x64
            asset: dcm-macos-x64
            built: dist/dcm
            arch: x64
          - os: ubuntu-latest
            label: linux-x64
            asset: dcm-linux-x64
            built: dist/dcm
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # A tag can very easily end up on a commit that predates the version
      # bump, in which case the release publishes binaries that report the
      # previous version. That has happened, and nothing caught it until
      # someone installed the release and read --version. Fail the build
      # instead.
      - name: The binary's version must match the tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          EXPECTED="${TAG#v}"
          BIN="dist/dcm"
          [ "${{ runner.os }}" = "Windows" ] && BIN="dist/dcm.exe"
          ACTUAL="$("$BIN" --version | tr -d '\r\n')"
          echo "tag=$TAG expected=$EXPECTED actual=$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tag $TAG expects version $EXPECTED but the binary reports $ACTUAL. The tag is probably on a commit older than the version bump in package.json."
            exit 1
          fi

      - name: Name the artifact for its platform
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.built }}" "out/${{ matrix.asset }}"
          chmod +x "out/${{ matrix.asset }}" || true

      # A binary labelled x64 that is actually arm64 fails on the machine it was
      # published for, and the label is the only thing anyone downloading it has
      # to go on. Check what was really produced rather than trusting the name.
      - name: Verify the binary matches the architecture it is named for
        if: runner.os != 'Windows'
        shell: bash
        run: |
          asset="out/${{ matrix.asset }}"
          info="$(file -b "$asset")"
          echo "$asset -> $info"
          case "${{ matrix.arch }}" in
            x64)
              echo "$info" | grep -Eq 'x86[-_]64|x86_64' \
                || { echo "::error::${{ matrix.asset }} is not x86-64: $info"; exit 1; } ;;
            arm64)
              echo "$info" | grep -Eq 'arm64|aarch64' \
                || { echo "::error::${{ matrix.asset }} is not arm64: $info"; exit 1; } ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One checksum file covering every platform, so anyone can verify the
      # download they actually took rather than trusting the release page.
      - name: Generate checksums
        run: |
          cd artifacts
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            || gh release upload "$TAG" artifacts/* --repo "${{ github.repository }}" --clobber

  npm:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    # `npm publish --provenance` signs the package with a build attestation so
    # anyone can verify it came from this repository and this workflow. That
    # needs an OIDC token, and job-level permissions replace the workflow-level
    # block rather than adding to it — so contents:write has to be restated
    # here alongside id-token:write, or provenance fails at publish time.
    permissions:
      contents: read
      id-token: write
    # Secrets are not available in job-level `if`, so the gate lives in the
    # step below. Without an NPM_TOKEN secret this job runs and does nothing,
    # which is the intended behaviour for anyone who has not set one up.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "No NPM_TOKEN secret is set, so nothing was published to npm."
            echo "To enable it: create an npm automation token, then"
            echo "  gh secret set NPM_TOKEN"
            echo "Every future tag will then publish automatically."
            exit 0
          fi

          npm ci

          # The tag is the source of truth for what is being released. A
          # mismatch means the tag is on a commit older than the version bump,
          # which is how a release ends up published under the wrong number.
          EXPECTED="${TAG#v}"
          ACTUAL="$(node -p "require('./package.json').version")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tag $TAG expects version $EXPECTED but package.json says $ACTUAL."
            exit 1
          fi

          # Re-publishing an existing version is a hard error on npm, and a
          # re-run of a release workflow is entirely normal. Treat an already
          # published version as success rather than failing the whole run.
          if npm view "dcm-cli-agent@$ACTUAL" version >/dev/null 2>&1; then
            echo "dcm-cli-agent@$ACTUAL is already on npm; nothing to do."
            exit 0
          fi

          npm publish --provenance --access public
          echo "Published dcm-cli-agent@$ACTUAL"
