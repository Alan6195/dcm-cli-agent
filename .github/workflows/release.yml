name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true

# Builds only read. The write token is granted to the publish job alone, so
# test code and dependency install scripts never run holding it.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            asset: dcm-windows-x64.exe
            built: dist/dcm.exe
            arch: x64
          - os: macos-latest
            label: macos-arm64
            asset: dcm-macos-arm64
            built: dist/dcm
            arch: arm64
          # Intel Macs are built on the Apple Silicon runner using an x64
          # Node under Rosetta 2. A SEA is a copy of the running Node binary,
          # so an x64 Node produces an x64 executable. The dedicated macos-13
          # runner label is being retired and can queue indefinitely, which
          # would block every release behind a runner that never arrives.
          - os: macos-latest
            label: macos-x64
            asset: dcm-macos-x64
            built: dist/dcm
            arch: x64
          - os: ubuntu-latest
            label: linux-x64
            asset: dcm-linux-x64
            built: dist/dcm
            arch: x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}

      - run: npm ci
      - run: npm test
      - run: npm run build

      # A tag can very easily end up on a commit that predates the version
      # bump, in which case the release publishes binaries that report the
      # previous version. That has happened, and nothing caught it until
      # someone installed the release and read --version. Fail the build
      # instead.
      - name: The binary's version must match the tag
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          EXPECTED="${TAG#v}"
          BIN="dist/dcm"
          [ "${{ runner.os }}" = "Windows" ] && BIN="dist/dcm.exe"
          ACTUAL="$("$BIN" --version | tr -d '\r\n')"
          echo "tag=$TAG expected=$EXPECTED actual=$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Tag $TAG expects version $EXPECTED but the binary reports $ACTUAL. The tag is probably on a commit older than the version bump in package.json."
            exit 1
          fi

      - name: Name the artifact for its platform
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.built }}" "out/${{ matrix.asset }}"
          chmod +x "out/${{ matrix.asset }}" || true

      # A binary labelled x64 that is actually arm64 fails on the machine it was
      # published for, and the label is the only thing anyone downloading it has
      # to go on. Check what was really produced rather than trusting the name.
      - name: Verify the binary matches the architecture it is named for
        if: runner.os != 'Windows'
        shell: bash
        run: |
          asset="out/${{ matrix.asset }}"
          info="$(file -b "$asset")"
          echo "$asset -> $info"
          case "${{ matrix.arch }}" in
            x64)
              echo "$info" | grep -Eq 'x86[-_]64|x86_64' \
                || { echo "::error::${{ matrix.asset }} is not x86-64: $info"; exit 1; } ;;
            arm64)
              echo "$info" | grep -Eq 'arm64|aarch64' \
                || { echo "::error::${{ matrix.asset }} is not arm64: $info"; exit 1; } ;;
          esac

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store it against the repo

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      # One checksum file covering every platform, so anyone can verify the
      # download they actually took rather than trusting the release page.
      - name: Generate checksums
        run: |
          cd artifacts
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # SHA256SUMS only proves a download matches the release page. A build
      # provenance attestation proves the binary was built by this workflow
      # from this repo at this commit, so a swapped release asset fails
      # `gh attestation verify` even if its checksum file was swapped too.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/dcm-*'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # The release page shows an asset's label INSTEAD of its filename,
          # so every label repeats the real filename in parentheses. gh takes
          # 'path#label' on both create and upload. The mapping covers the
          # desktop installers too, so both workflows label identically no
          # matter which one wins the race to create the release.
          label_for() {
            case "$1" in
              dcm-windows-x64.exe)    echo "CLI — Windows x64 ($1)" ;;
              dcm-macos-arm64)        echo "CLI — macOS Apple Silicon ($1)" ;;
              dcm-macos-x64)          echo "CLI — macOS Intel ($1)" ;;
              dcm-linux-x64)          echo "CLI — Linux x64 ($1)" ;;
              SHA256SUMS.txt)         echo "Checksums for the CLI binaries ($1)" ;;
              *-setup.exe)            echo "App — Windows installer, auto-updates ($1)" ;;
              *-portable.exe)         echo "App — Windows portable, no install ($1)" ;;
              *arm64*.dmg)            echo "App — macOS Apple Silicon ($1)" ;;
              *x64*.dmg)              echo "App — macOS Intel ($1)" ;;
              latest*.yml|*.blockmap) echo "App auto-update metadata — leave attached ($1)" ;;
              *)                      echo "" ;;
            esac
          }

          assets=()
          for f in artifacts/*; do
            label="$(label_for "$(basename "$f")")"
            if [ -n "$label" ]; then
              assets+=("$f#$label")
            else
              assets+=("$f")
            fi
          done

          # --notes-file supplies the "which file do I want" guide as the
          # body; --generate-notes then appends the generated changelog after
          # it (the API prepends a supplied body to generated notes).
          gh release create "$TAG" "${assets[@]}" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            --notes-file .github/RELEASE_NOTES_HEADER.md \
            || gh release upload "$TAG" "${assets[@]}" --repo "${{ github.repository }}" --clobber
